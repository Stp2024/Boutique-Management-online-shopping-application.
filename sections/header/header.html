<!-- =====================================================
     HEADER & NAVIGATION · VASTRAÉ ATELIER
     ===================================================== -->
<header class="nak-header">
  <a class="nak-brand" href="#home">
    <div class="nak-brand-title">
      <span>✨</span> VASTRAÉ
    </div>
    <div class="nak-brand-sub">
      HAUTE COUTURE ATELIER &middot; BENGALURU
    </div>
  </a>

  <!-- Mobile Hamburger -->
  <button class="menu nak-action-btn" onclick="document.querySelector('.nak-nav').classList.toggle('mobile-active')" style="display:none;">
    ☰
  </button>

  <!-- Navigation Links: Exactly Home, About, Services, Collection, Contact as requested -->
  <nav class="nak-nav">
    <a href="#home" class="nak-nav-link active">Home</a>
    <a href="#about" class="nak-nav-link">About</a>
    <a href="#services" class="nak-nav-link">Services</a>
    <a href="#collection" class="nak-nav-link">Collection</a>
    <a href="#contact" class="nak-nav-link">Contact</a>
  </nav>

  <!-- Header Right Tools -->
  <div class="nak-header-actions">
    <!-- Wishlist Button -->
    <button class="nak-action-btn" onclick="window.openWishlist()" title="View Wishlist">
      <span>♡</span>
      <span class="nak-badge-pill" id="wishCount">0</span>
    </button>

    <!-- Bag Button -->
    <button class="nak-action-btn" onclick="window.openCart()" title="View Bag">
      <span>🛍️</span>
      <span>Bag</span>
      <span class="nak-badge-pill" id="cartCount">0</span>
    </button>

    <!-- Customer Login / Profile Button -->
    <button class="nak-action-btn nak-btn-gold" id="headerAuthBtn" onclick="window.openCustomerWorkspace()" title="Client Atelier Sanctuary">
      <span>👤</span>
      <span id="headerClientName">Ananya (VIP)</span>
    </button>

    <!-- Portal Switcher Dropdown (Customer, Tailor, Admin) -->
    <div style="position:relative; display:inline-block;">
      <select id="portalSwitcherSelect" onchange="window.switchPortalRole(this.value)" style="background:#2a080c; color:#d4af37; border:1px solid #d4af37; border-radius:18px; padding:6px 12px; font-size:12px; font-weight:600; outline:none; cursor:pointer;">
        <option value="customer">👤 Patron Workspace</option>
        <option value="tailor">✂️ Master Tailor Studio</option>
        <option value="admin">🛡️ Atelier Admin Studio</option>
      </select>
    </div>
  </div>
</header>
