<!-- =====================================================
ORDER TRACKING SECTION
===================================================== -->
<section class="tracking" id="tracking">
  <div class="heading">
    <small>
      THE BOUTIQUE JOURNEY
    </small>
    <h2>
      Live Garment &amp; Stitching Tracker
    </h2>
    <p>
      Track your made-to-measure and bespoke couture from fabric sourcing to white-glove dispatch.
    </p>
  </div>

  <div class="tracking-search-bar" style="max-width: 620px; margin: 0 auto 18px; display: flex; gap: 10px; flex-wrap: wrap; padding: 0 16px;">
    <input type="text" id="trackOrderInput" placeholder="Enter Order Code (#FABRIC-2026-...) or Pickup Ref (#PICKUP-2026-...)" style="flex: 1; min-width: 220px; padding: 13px 18px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff;" onkeydown="if(event.key==='Enter')trackCustomOrderSearch()">
    <button class="btn btn-dark" onclick="trackCustomOrderSearch()" style="padding: 13px 24px; border-radius: 8px; font-weight: 600;">Track Garment</button>
  </div>

  <div class="tracking-quick-pills" id="trackingQuickPills" style="max-width: 720px; margin: 0 auto 36px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 16px;">
    <!-- Filled dynamically by updateOrderPills() -->
  </div>

  <div id="trackingTimelineContainer">
    <!-- Rendered dynamically by trackOrderById() -->
  </div>
</section>
