<!-- =====================================================
CUSTOM STUDIO SECTION
===================================================== -->
<section class="custom" id="custom">
 <div class="heading">
  <small>
   BESPOKE STUDIO
  </small>
  <h2>
   Create Your Garment
  </h2>
  <p>
   Your design. Your measurements. Your details.
  </p>
 </div>
 <div class="custom-layout">
  <div class="custom-image">
  </div>
  <form class="custom-form" onsubmit="submitCustom(event)">
   <h3>
    Design Your Own
   </h3>
   <p>
    Select your garment and tell our boutique team exactly how you
           want it created.
   </p>
   <div class="fields">
    <div class="field">
     <label>
      NAME
     </label>
     <input id="customName" placeholder="Your name" required=""/>
    </div>
    <div class="field">
     <label>
      GARMENT
     </label>
     <select>
      <option>
       Designer Dress
      </option>
      <option>
       Blouse
      </option>
      <option>
       Saree
      </option>
      <option>
       Kurta
      </option>
      <option>
       Suit
      </option>
      <option>
       Lehenga
      </option>
      <option>
       Sherwani
      </option>
     </select>
    </div>
    <div class="field">
     <label>
      STYLE
     </label>
     <select>
      <option>
       Modern
      </option>
      <option>
       Traditional
      </option>
      <option>
       Formal
      </option>
      <option>
       Semi-Formal
      </option>
      <option>
       Semi-Modern
      </option>
      <option>
       Designer
      </option>
     </select>
    </div>
    <div class="field">
     <label>
      SIZE
     </label>
     <select>
      <option>
       S
      </option>
      <option>
       M
      </option>
      <option>
       L
      </option>
      <option>
       XL
      </option>
      <option>
       XXL
      </option>
      <option>
       Custom Measurements
      </option>
     </select>
    </div>
    <div class="field">
     <label>
      COLOUR
     </label>
     <input placeholder="Champagne / Navy / Emerald"/>
    </div>
    <div class="field">
     <label>
      OCCASION
     </label>
     <select>
      <option>
       Daily Wear
      </option>
      <option>
       Office
      </option>
      <option>
       Party
      </option>
      <option>
       Wedding
      </option>
      <option>
       Festival
      </option>
      <option>
       Event
      </option>
     </select>
    </div>
    <div class="field full">
     <label>
      DESIGN REQUIREMENTS
     </label>
     <textarea placeholder="Neckline, sleeves, embroidery, fabric, fit, finishing..."></textarea>
    </div>
    <div class="field full">
     <label>
      REFERENCE IMAGE
     </label>
     <input accept="image/*" type="file"/>
    </div>
   </div>
   <br/>
   <button class="btn btn-dark">
    Submit Design Request
   </button>
  </form>
 </div>
</section>
