<!-- =====================================================
DIGITAL MEASUREMENTS SECTION
===================================================== -->
<section class="measure" id="measurements">
 <div class="heading">
  <small>
   PERSONAL PROFILE &middot; BIOMETRIC VAULT
  </small>
  <h2>
   Digital Measurements &amp; In-Store AI Scanner
  </h2>
  <p>
   Save multi-profile body metrics (Self, Family, Wedding Trousseau) or run our In-Store AI Optical Body Scanner Simulation.
  </p>
 </div>
 <div class="measure-box">
  <div style="margin-bottom:16px;">
   <label style="font-weight:700; font-size:12px; display:block; margin-bottom:6px;">SELECT PROFILE PRESET</label>
   <select id="mProfilePreset" class="vas-select" onchange="window.onMeasurementPresetChange(this.value)" style="width:100%; max-width:400px;">
    <option value="self">Ananya Sharma (Self Profile)</option>
    <option value="family">Devendra Sharma (Family / Spouse Profile)</option>
    <option value="wedding">Wedding Trousseau Preset</option>
   </select>
  </div>
  <div class="measure-grid">
   <div>
    <label>HEIGHT (CM)</label>
    <input id="mHeight" placeholder="e.g. 168"/>
   </div>
   <div>
    <label>CHEST / BUST (CM)</label>
    <input id="mChest" placeholder="e.g. 88"/>
   </div>
   <div>
    <label>WAIST (CM)</label>
    <input id="mWaist" placeholder="e.g. 72"/>
   </div>
   <div>
    <label>HIP (CM)</label>
    <input id="mHip" placeholder="e.g. 96"/>
   </div>
   <div>
    <label>SHOULDER (CM)</label>
    <input id="mShoulder" placeholder="e.g. 39"/>
   </div>
   <div>
    <label>SLEEVE (CM)</label>
    <input id="mSleeve" placeholder="e.g. 54"/>
   </div>
   <div>
    <label>BLOUSE LENGTH (CM)</label>
    <input id="mBlouse" placeholder="e.g. 38"/>
   </div>
   <div>
    <label>ANKLE HEIGHT (CM)</label>
    <input id="mAnkle" placeholder="e.g. 104"/>
   </div>
  </div>
  <br/>
  <div style="display:flex; gap:12px; flex-wrap:wrap;">
   <button class="btn btn-dark" onclick="window.saveMeasurements()">
    Save Measurement Profile
   </button>
   <button class="btn btn-gold" onclick="window.startAIScannerSimulation()" style="background:var(--vas-gold, #c5a059); color:#fff; border:none;">
    📷 Start In-Store AI Measurement Scanner Simulation
   </button>
  </div>
 </div>
</section>
