<!-- =====================================================
DIGITAL MEASUREMENTS SECTION
===================================================== -->
<section class="measure" id="measurements">
 <div class="heading">
  <small>
   PERSONAL PROFILE
  </small>
  <h2>
   Digital Measurements
  </h2>
  <p>
   Save your common measurements for easier custom orders in the
         future.
  </p>
 </div>
 <div class="measure-box">
  <div class="measure-grid">
   <div>
    <label>
     HEIGHT
    </label>
    <input id="mHeight" placeholder="cm"/>
   </div>
   <div>
    <label>
     CHEST / BUST
    </label>
    <input id="mChest" placeholder="cm"/>
   </div>
   <div>
    <label>
     WAIST
    </label>
    <input id="mWaist" placeholder="cm"/>
   </div>
   <div>
    <label>
     HIP
    </label>
    <input id="mHip" placeholder="cm"/>
   </div>
   <div>
    <label>
     SHOULDER
    </label>
    <input id="mShoulder" placeholder="cm"/>
   </div>
   <div>
    <label>
     SLEEVE
    </label>
    <input id="mSleeve" placeholder="cm"/>
   </div>
  </div>
  <br/>
  <button class="btn btn-dark" onclick="saveMeasurements()">
   Save Measurement Profile
  </button>
 </div>
</section>
